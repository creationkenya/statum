<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statum Wallet Top-Up Dispatcher</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #111; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    textarea { height: 120px; font-family: monospace; resize: vertical; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
    button { background-color: #0070f3; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; font-weight: 600; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0051a2; }
    #log { margin-top: 20px; background: #1e1e1e; color: #00ff66; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 13px; height: 150px; overflow-y: auto; white-space: pre-wrap; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: 1px solid #ccc; background: #eee; cursor: pointer; font-weight: 600; border-radius: 4px; text-align: center; }
    .tab-btn.active { background: #0070f3; color: #fff; border-color: #0070f3; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Statum Wallet STK Dispatcher</h2>

    <div class="tab-buttons">
      <div class="tab-btn active" onclick="switchTab('single')">Single Request</div>
      <div class="tab-btn" onclick="switchTab('bulk')">Bulk Dispatch</div>
    </div>

    <!-- Single Request Form -->
    <div id="single-tab" class="tab-content active">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="single-phone" placeholder="254712345678" />
      </div>
      <div class="form-group">
        <label>Amount (KES)</label>
        <input type="number" id="single-amount" placeholder="100" />
      </div>
      <button onclick="sendSingle()">Send STK Push</button>
    </div>

    <!-- Bulk Request Form -->
    <div id="bulk-tab" class="tab-content">
      <div class="form-group">
        <label>Phone Numbers & Amounts (One per line: phone,amount)</label>
        <textarea id="bulk-input" placeholder="254712345678,100&#10;254787654321,250&#10;254700000000,500"></textarea>
        <div class="hint">Items will automatically process sequentially with an 8-second interval.</div>
      </div>
      <button onclick="sendBulk()">Enqueue Bulk Dispatch</button>
    </div>

    <h3>Console Log</h3>
    <div id="log">Ready...</div>
  </div>

  <script>
    function logMessage(msg) {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.textContent += `\n[${time}] ${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tab === 'single') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('single-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('bulk-tab').classList.add('active');
      }
    }

    async function sendSingle() {
      const phoneNumber = document.getElementById('single-phone').value.trim();
      const amount = document.getElementById('single-amount').value.trim();

      if (!phoneNumber || !amount) {
        alert('Please fill in both Phone Number and Amount.');
        return;
      }

      logMessage(`Sending STK Push request for ${phoneNumber} (KES ${amount})...`);

      try {
        const res = await fetch('/stk-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber, amount: Number(amount) })
        });
        const data = await res.json();
        logMessage(`Response: ${JSON.stringify(data)}`);
      } catch (err) {
        logMessage(`Error: ${err.message}`);
      }
    }

    async function sendBulk() {
      const rawText = document.getElementById('bulk-input').value.trim();
      if (!rawText) {
        alert('Please enter at least one phone number.');
        return;
      }

      const lines = rawText.split('\n');
      const requests = [];

      for (const line of lines) {
        const parts = line.split(',');
        if (parts.length >= 2) {
          requests.push({
            phoneNumber: parts[0].trim(),
            amount: Number(parts[1].trim())
          });
        }
      }

      if (requests.length === 0) {
        alert('Invalid format. Use line-separated format: phone,amount');
        return;
      }

      logMessage(`Enqueuing ${requests.length} requests (8-second rate limit between each)...`);

      try {
        const res = await fetch('/batch-stk-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requests })
        });
        const data = await res.json();
        logMessage(`Server response: ${data.message || JSON.stringify(data)}`);
      } catch (err) {
        logMessage(`Error: ${err.message}`);
      }
    }
  </script>
</body>
</html>
